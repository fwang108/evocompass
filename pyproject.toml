[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evocompass"
version = "0.1.0"
description = "Correspondence-guided edit flows for directional protein evolution"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.2",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "pyarrow>=14", "matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
evocompass-prepare = "evocompass.cli:prepare_main"
evocompass-train = "evocompass.cli:train_main"
evocompass-sample = "evocompass.cli:sample_main"
evocompass-evaluate = "evocompass.cli:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

